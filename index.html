<html lang="tr"><head><meta charset="utf-8">

<style>

button.alt{background:#fff;color:#000}

.row{display:flex;gap:8px}.row input{flex:1;min-width:0;text-transform:uppercase}
#rc{font-size:44px;font-weight:900;letter-spacing:6px;color:#ffd23f;text-shadow:0 3px 10px #0008}
#pl{display:flex;flex-direction:column;gap:6px}
#pl div{background:#0008;border-radius:10px;padding:8px 12px;font-weight:700}
.note{margin:0;font-size:14px;opacity:.9;text-shadow:0 2px 6px #000}
#pause label{display:flex;flex-direction:column;gap:6px;font-weight:700}

const $=id=>document.getElementById(id),wrap=$('wrap');
const ren=new THREE.WebGLRenderer({antialias:true});wrap.appendChild(ren.domElement);

const cam=new THREE.PerspectiveCamera(75,1,.5,200);

const sun=new THREE.DirectionalLight(0xfff2cc,.9);sun.position.set(6,12,8);scene.add(sun);

const mesh=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};

function mkChar(mat){const hero=new THREE.Group(),model=new THREE.Group();hero.add(model);model.scale.setScalar(.7);

 model.add(mesh(new THREE.CylinderGeometry(.3,.3,.12,24),mat,0,.92,0));
 const headG=new THREE.Group();headG.position.set(0,1.25,0);model.add(headG);
 const head=mesh(new THREE.SphereGeometry(.34,28,20),mat,0,0,0);head.scale.set(1,.85,1);headG.add(head);
 [-1,1].forEach(s=>{headG.add(mesh(new THREE.SphereGeometry(.15,20,16),wm,s*.17,.02,.24));headG.add(mesh(new THREE.SphereGeometry(.065,12,10),bk,s*.17+.02,.06,.37))});
 const legs=[],arms=[];
 [-1,1].forEach(s=>{
  const l=new THREE.Group();l.position.set(s*.12,.45,0);const c=mesh(new THREE.ConeGeometry(.09,.45,14),mat,0,-.225,0);c.rotation.x=Math.PI;l.add(c);model.add(l);legs.push(l);
  const a=new THREE.Group();a.position.set(s*.33,.88,0);a.add(mesh(new THREE.CylinderGeometry(.06,.06,.4,12),mat,0,-.2,0));a.add(mesh(new THREE.SphereGeometry(.085,12,10),mat,0,-.42,0));model.add(a);arms.push(a)});

const me=mkChar(gm);scene.add(me.hero);const{hero,model,headG,legs,arms}=me;
// parkur: yukarı doğru sarmal
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PL=[[0,0,0,7,7]],SP=[];let th=0;
for(let i=1;i<=150;i++){th+=.65+rnd()*.1;const R=7.5+Math.sin(i*.9)*1.3,w=i==150?5:2.8+rnd()*.8,pv=PL[i-1];
 const p=[Math.cos(th)*R,pv[1]+.7+rnd()*.35,Math.sin(th)*R,w,w];PL.push(p);if(i%9==5)SP.push([p[0],p[1],p[2]])}
const GOAL=PL[PL.length-1];
for(const[x,y,z,w,d]of PL){scene.add(mesh(new THREE.BoxGeometry(w,.9,d),M(0x8a5a2b),x,y-.55,z));scene.add(mesh(new THREE.BoxGeometry(w,.1,d),M(0x5ad17a),x,y-.05,z))}
for(const[x,y,z]of SP)for(let i=0;i<5;i++){const a=i*1.26;scene.add(mesh(new THREE.ConeGeometry(.2,.6,4),M(0xdddddd,{metalness:.6}),x+(i?Math.cos(a)*.4:0),y+.3,z+(i?Math.sin(a)*.4:0)))}
scene.add(mesh(new THREE.CylinderGeometry(.05,.05,3,8),M(0xeeeeee),GOAL[0],GOAL[1]+1.5,GOAL[2]));
scene.add(mesh(new THREE.BoxGeometry(1.2,.7,.05),M(0xffd23f,{emissive:0x664400}),GOAL[0]+.65,GOAL[1]+2.6,GOAL[2]));
scene.add(mesh(new THREE.TorusGeometry(1.3,.06,8,32),M(0xffd23f,{emissive:0x886600}),GOAL[0],GOAL[1]+1.3,GOAL[2]));
const gr=mesh(new THREE.PlaneGeometry(700,700),M(0x4caf50),0,-8,0);gr.rotation.x=-Math.PI/2;scene.add(gr);
for(let i=0;i<80;i++){const a=rnd()*6.283,r=15+rnd()*50,h=6+rnd()*8,x=Math.cos(a)*r,z=Math.sin(a)*r;
 scene.add(mesh(new THREE.CylinderGeometry(.4,.55,h,8),M(0x6b4423),x,-8+h/2,z));
 scene.add(mesh(new THREE.ConeGeometry(2.2+rnd()*1.2,h*.8,8),M(0x2e8b3a+Math.floor(rnd()*3)*0x081008),x,-8+h+h*.2,z))}
const cm=M(0xffffff,{roughness:1,emissive:0x444444});
for(let i=0;i<70;i++){const a=rnd()*6.283,r=14+rnd()*30,y=4+i*1.9,x=Math.cos(a)*r,z=Math.sin(a)*r;
 for(let k=0;k<3;k++){const c=mesh(new THREE.SphereGeometry(1.5+rnd()*1.5,12,10),cm,x+k*1.8,y+rnd(),z+rnd()*2);c.scale.y=.6;scene.add(c)}}
// oyun durumu
let sens=3,userFov=55,paused=false,deaths=0,run=false,cp=0,P={hang:-1,pt:-1},K={},yaw=0,pitch=.4,ry=0,t=0,ma=0,last=performance.now();
const H=1,R=.3;
function reset(){const s=PL[cp];P={x:s[0],y:s[1]+.01,z:s[2],vy:0,g:false,hang:-1,pt:-1,grabCd:0,hx:0,hz:-1,cd:0,dx:0,dz:-1,jp:0,run:false}}
const km={w:'w',a:'a',s:'s',d:'d',' ':'j',shift:'x',q:'q',e:'e'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=km[e.key.toLowerCase()];if(k){e.preventDefault();K[k]=1}});
addEventListener('keyup',e=>{const k=km[e.key.toLowerCase()];if(k)K[k]=0});
const cv=ren.domElement;
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===cv){yaw-=e.movementX*.0008*sens;pitch=Math.max(-1.3,Math.min(1.45,pitch+e.movementY*.0008*sens))}});
cv.addEventListener('click',()=>{if(run&&!paused)cv.requestPointerLock()});
const over=(x,z,p)=>Math.abs(x-p[0])<p[3]/2+R&&Math.abs(z-p[2])<p[4]/2+R;
const hit=(x,y,z)=>PL.some(p=>over(x,z,p)&&y<p[1]-.02&&y+H>p[1]-1);
const hitI=(x,y,z)=>PL.findIndex(p=>over(x,z,p)&&y<p[1]-.02&&y+H>p[1]-1);
function tryGrab(i,hx,hz){const p=PL[i];if(P.g||P.hang>=0||P.grabCd>0||P.vy>0)return;const hand=P.y+.9;if(hand>p[1]-.3&&hand<p[1]+.05){P.hang=i;P.hx=hx;P.hz=hz;P.vy=0;P.pt=-1;P.y=p[1]-.9;P.grip=2;P.gt=.25}}
function hangStep(dt){const p=PL[P.hang];
 if(P.pt>=0){P.pt+=dt/.7;const k=Math.min(1,P.pt),ky=Math.min(1,k*1.6),kh=Math.max(0,(k-.45)/.55);P.x=P.sx+P.hx*(R+.4)*kh;P.z=P.sz+P.hz*(R+.4)*kh;P.y=P.sy+(p[1]-P.sy)*ky;if(k>=1){P.hang=-1;P.pt=-1;P.vy=0;P.g=true;P.grabCd=.3}return}
 P.vy=0;
 P.grip-=dt;if(K.s||P.grip<=0){P.hang=-1;P.grabCd=.5;return}
 if(K.j&&!P.jp){P.pt=0;P.sx=P.x;P.sy=P.y;P.sz=P.z;P.jp=1}
 if(!K.j)P.jp=0}
function die(){deaths++;$('dc').textContent='Ölüm: '+deaths;reset()}
function step(dt){
 if(K.q)yaw+=1.8*dt;if(K.e)yaw-=1.8*dt;
 const f=(K.w?1:0)-(K.s?1:0),r=(K.d?1:0)-(K.a?1:0);
 let mx=-Math.sin(yaw)*f+Math.cos(yaw)*r,mz=-Math.cos(yaw)*f-Math.sin(yaw)*r;const m=Math.hypot(mx,mz);
 if(m>0){mx/=m;mz/=m;P.dx=mx;P.dz=mz}else{P.dx=-Math.sin(yaw);P.dz=-Math.cos(yaw)}
 if(P.g)P.run=!!K.x&&m>0;
 const spd=P.run?6.5:3.2;let vx=mx*spd,vz=mz*spd;
 P.mv=m>0;P.grabCd-=dt;if(P.hang>=0){hangStep(dt);return}
 let nx=P.x+vx*dt,bi=hitI(nx,P.y,P.z);if(bi<0)P.x=nx;else tryGrab(bi,Math.sign(vx),0);
 let nz=P.z+vz*dt;bi=hitI(P.x,P.y,nz);if(bi<0)P.z=nz;else tryGrab(bi,0,Math.sign(vz));
 if(K.j&&P.g&&!P.jp){P.vy=10;P.jp=1}if(!K.j)P.jp=0;
 P.vy-=28*dt;const ny=P.y+P.vy*dt;P.g=false;
 if(P.vy<=0){for(let i=0;i<PL.length;i++){const p=PL[i];if(over(P.x,P.z,p)&&P.y>=p[1]-.15&&ny<=p[1]){P.y=p[1];P.vy=0;P.g=true;if(i>cp)cp=i;break}}if(!P.g)P.y=ny}
 else{if(hit(P.x,ny,P.z))P.vy=0;else P.y=ny}
 for(const[x,y,z]of SP)if(Math.hypot(P.x-x,P.z-z)<.7&&P.y<y+.5&&P.y+H>y)die();
 if(P.y<PL[cp][1]-8)die();
 if(Math.hypot(P.x-GOAL[0],P.z-GOAL[2])<1.5&&Math.abs(P.y-GOAL[1])<1.5){run=false;end()}}
const wr=a=>Math.atan2(Math.sin(a),Math.cos(a));
function draw(dt){
 const air=!P.g,mv=run&&P.mv,rn=P.run&&mv;
 if(mv&&!air)t+=dt*(P.run?13:7);else if(!mv)t*=.9;
 const sw=air?0:Math.sin(t)*(rn?1.2:.55);
 legs[0].rotation.x=air?.5:sw;legs[1].rotation.x=air?-.4:-sw;
 arms[0].rotation.x=air?-2.4:-sw*(rn?1.3:.8);arms[1].rotation.x=air?-2.4:sw*(rn?1.3:.8);
 arms[0].rotation.z=rn&&!air?-.3:0;arms[1].rotation.z=rn&&!air?.3:0;
 if(!mv&&!air)arms[1].rotation.x=-2.2;
 P.gt=Math.max(0,(P.gt||0)-dt);const sq=P.gt/.25;
 if(P.hang>=0){const T=performance.now()/1000;
  if(P.pt>=0){const k=Math.min(1,P.pt),s=Math.sin(k*Math.PI);arms[0].rotation.x=arms[1].rotation.x=-3.1+k*1.7;legs[0].rotation.x=-1.1*s;legs[1].rotation.x=.5*s}
  else{const w2=Math.sin(T*5)*.3,f=P.grip<.7?Math.sin(T*40)*.08:0;arms[0].rotation.x=-3.1+f;arms[1].rotation.x=-3.1-f;legs[0].rotation.x=w2;legs[1].rotation.x=-w2}}
 let bt=null;if(P.hang>=0)bt=Math.atan2(P.hx,P.hz);else if(P.mv&&run)bt=Math.atan2(P.dx,P.dz);
 if(bt!==null)ry+=wr(bt-ry)*.25;
 const rel=wr(yaw+Math.PI-ry),cl=Math.max(-1.5708,Math.min(1.5708,rel));
 if(bt===null&&Math.abs(rel)>1.5708)ry+=rel-cl;
 headG.rotation.y+=(cl-headG.rotation.y)*.4;headG.rotation.z=(rn&&!air)?-Math.sin(t)*.12:0;
 headG.rotation.x+=(Math.max(-1.5,Math.min(1.5,pitch-.3))-headG.rotation.x)*.4;
 model.rotation.y=ry;
 model.rotation.x=P.hang>=0?(P.pt>=0?.55*Math.sin(Math.min(1,P.pt)*Math.PI):0):(P.run&&!air?.22:0);
 model.rotation.z=(P.hang>=0&&P.pt<0)?Math.sin(performance.now()/450)*.1:(rn&&!air?Math.sin(t)*.14:(mv&&!air?Math.sin(t)*.05:0));
 model.scale.set(.7,.7*(1-.18*sq),.7);
 model.position.y=(!air&&mv)?Math.abs(Math.sin(t))*(rn?.14:.05):0;
 hero.position.set(P.x,P.y,P.z);
 $('lv').textContent='Yükseklik: '+Math.max(0,Math.floor(P.y))+' m'+(P.hang>=0&&P.pt<0?' · Tutunma: '+Math.max(0,P.grip).toFixed(1)+' sn':'');
 const dist=Math.max(4,4.8/Math.min(1,cam.aspect*1.2)),cp2=Math.cos(pitch)*dist;
 const tx=P.x+Math.sin(yaw)*cp2,ty=P.y+1+Math.sin(pitch)*dist,tz=P.z+Math.cos(yaw)*cp2;
 cam.position.x+=(tx-cam.position.x)*.15;cam.position.y+=(ty-cam.position.y)*.15;cam.position.z+=(tz-cam.position.z)*.15;
 cam.lookAt(P.x,P.y+.8,P.z)}
// ana menü sahnesi: karakter + yukarı uzanan parkur
let lx=0,lz=0;
function drawMenu(dt){ma+=dt*.12;const Rr=17,T=performance.now()/1000;
 cam.position.set(Math.sin(ma)*Rr,1.5+Math.sin(T*.3)*.5,Math.cos(ma)*Rr);cam.lookAt(0,9,0);
 hero.position.set(lx,0,lz);ry=ma;model.rotation.set(0,ma,0);model.scale.setScalar(1.1);
 model.position.y=Math.sin(T*2)*.02;legs[0].rotation.x=legs[1].rotation.x=0;
 arms[0].rotation.set(0,0,0);arms[1].rotation.set(-2.2,0,0);
 headG.rotation.set(-.25,Math.sin(T*.8)*.5,0)}
// çok oyunculu (room)
let ROOM=null,rm=null,unsub=null,host=false,code='',myName='',myCol=0,inLobby=false;
// PeerJS tabanlı oda sistemi (Claude dışında, örn. Vercel'de): oda sahibi merkez, diğerleri ona bağlanır
const peerRoom={join(name,isHost){return new Promise((resolve,reject)=>{
 const my={},table=new Map(),conns=new Map();let subs=[],myId='',hc=null,last=new Set(),dirty=false,iv=null,done=false;
 const peer=isHost?new Peer('tkgame-'+name):new Peer();
 const fail=e=>{if(done)return;done=true;clearInterval(iv);try{peer.destroy()}catch(_){}reject(e)};
 const emit=snap=>{const ids=Object.keys(snap);const peers=ids.map(id=>({peer:id,isMe:id===myId,presence:snap[id]||{}}));const left=[...last].filter(id=>!(id in snap)).map(id=>({peer:id,isMe:false,presence:{}}));last=new Set(ids);subs.forEach(f=>f({peers,left,joined:[],updated:[]}))};
 const room={
  presence(p){Object.assign(my,p);dirty=true;return Promise.resolve()},
  onPeers(f){subs.push(f);return()=>{subs=subs.filter(x=>x!==f)}},
  leave(){clearInterval(iv);try{peer.destroy()}catch(_){}subs=[];return Promise.resolve()}};
 peer.on('error',e=>{if(!done)fail(e)});
 setTimeout(()=>{if(!done)fail(new Error('timeout'))},9000);
 if(isHost){
  peer.on('open',id=>{myId=id;done=true;resolve(room);
   iv=setInterval(()=>{if(dirty){table.set(myId,{...my});dirty=false}const snap=Object.fromEntries(table);emit(snap);const m={t:'s',s:snap};conns.forEach(c=>{if(c.open)c.send(m)})},100)});
  peer.on('connection',c=>{c.on('open',()=>conns.set(c.peer,c));
   c.on('data',m=>{if(m&&m.t==='p'&&m.d&&typeof m.d==='object')table.set(c.peer,m.d)});
   c.on('close',()=>{conns.delete(c.peer);table.delete(c.peer)})})
 }else{
  peer.on('open',id=>{myId=id;hc=peer.connect('tkgame-'+name,{serialization:'json'});
   hc.on('open',()=>{done=true;resolve(room);iv=setInterval(()=>{if(dirty&&hc.open){hc.send({t:'p',d:my});dirty=false}},70)});
   hc.on('data',m=>{if(m&&m.t==='s'&&m.s)emit(m.s)});
   hc.on('close',()=>{clearInterval(iv);emit({[myId]:{...my}})})})
 }
})}};
const usePeer=()=>{ROOM=window.Peer?peerRoom:null;if(!ROOM)$('mnote').textContent='Çoklu oyun kapalı.'};
if(window.claude&&window.claude.use)window.claude.use('room').then(r=>{if(r)ROOM=r;else usePeer()}).catch(usePeer);else usePeer();
const COL=[0xff6b6b,0x5aa9ff,0xffd23f,0xc77dff,0xff9f43,0x2ee6d6],rem=new Map(),N=v=>+v||0;

 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.scale.set(2,.5,1);sp.position.y=1.9;sp.renderOrder=9;return sp}
function addRem(pk,pr){const ch=mkChar(M(COL[Math.abs(N(pr.c))%6],{roughness:.2,metalness:.2}));ch.lbl=label(String(pr.n||'Oyuncu').slice(0,14));ch.hero.add(ch.lbl);ch.hero.position.set(N(pr.x),N(pr.y),N(pr.z));ch.r=N(pr.r);ch.t=0;ch.tg=pr;scene.add(ch.hero);rem.set(pk,ch);return ch}
function clearRem(){for(const ch of rem.values())scene.remove(ch.hero);rem.clear()}
function updRem(dt){for(const ch of rem.values()){const g=ch.tg||{},p=ch.hero.position;
 p.x+=(N(g.x)-p.x)*.3;p.y+=(N(g.y)-p.y)*.3;p.z+=(N(g.z)-p.z)*.3;
 ch.r+=wr(N(g.r)-ch.r)*.3;ch.model.rotation.y=ch.r;const m=N(g.m),wk=m==1||m==2;if(wk)ch.t+=dt*(m==2?13:7);
 const s=Math.sin(ch.t),a=m==2?1.2:.55,up=m==3||m==4;
 ch.legs[0].rotation.x=m==4?.5:(wk?s*a:0);ch.legs[1].rotation.x=m==4?-.4:(wk?-s*a:0);
 ch.arms[0].rotation.x=up?-2.6:(wk?-s*a:0);ch.arms[1].rotation.x=up?-2.6:(wk?s*a:0);
 ch.headG.rotation.y=N(g.h);ch.model.position.y=wk?Math.abs(s)*(m==2?.14:.05):0}}
function onPeers(ch){
 for(const p of ch.peers){if(p.isMe)continue;const o=rem.get(p.peer);if(o)o.tg=p.presence;else addRem(p.peer,p.presence)}
 for(const p of ch.left){const o=rem.get(p.peer);if(o){scene.remove(o.hero);rem.delete(p.peer)}}
 const pl=$('pl');pl.textContent='';
 for(const p of ch.peers){const d=document.createElement('div');d.textContent=String(p.presence.n||'Oyuncu').slice(0,14)+(p.presence.host?' 👑':'')+(p.isMe?' (sen)':'');pl.appendChild(d)}
 $('rm').textContent='Oda: '+code.toUpperCase()+' · '+ch.peers.length+' oyuncu';
 if(inLobby&&!run&&ch.peers.some(p=>!p.isMe&&p.presence.st==1))startGame()}
async function joinRoom(c,isHost){
 if(!ROOM){$('mnote').textContent='Çoklu oyun bu görünümde kapalı. Arkadaşlarının sayfayı paylaşım bağlantısıyla açması gerekir.';return}
 $('mnote').textContent='Bağlanılıyor...';
 try{rm=await ROOM.join('tk-'+c,isHost)}catch(e){$('mnote').textContent='Oda bulunamadı ya da bağlanılamadı.';return}
 code=c;host=isHost;myName=($('nick').value.trim()||'Oyuncu'+(100+Math.floor(Math.random()*900))).slice(0,14);myCol=Math.floor(Math.random()*6);
 lx=(Math.random()-.5)*4;lz=(Math.random()-.5)*3+1.5;inLobby=true;
 rm.presence({n:myName,c:myCol,host:host?1:0,st:0,x:lx,y:0,z:lz,r:0,h:0,m:0}).catch(()=>{});
 unsub=rm.onPeers(onPeers);
 $('mmain').style.display='none';$('mlob').style.display='flex';$('rc').textContent=c.toUpperCase();
 $('st').style.display=host?'block':'none';$('lnote').textContent=host?'Arkadaşların bu kodla katılsın, sonra başlat.':'Oda sahibi oyunu başlatınca oyun açılır.';$('mnote').textContent=''}
async function leaveRoom(){inLobby=false;if(unsub){unsub();unsub=null}if(rm){try{await rm.leave()}catch(e){}rm=null}clearRem();code='';$('rm').textContent=''}
$('mk').onclick=()=>joinRoom(Math.random().toString(36).slice(2,7),true);
$('jn').onclick=()=>{const c=$('code').value.trim().toLowerCase();if(!/^[a-z0-9]{3,6}$/.test(c)){$('mnote').textContent='Geçerli bir oda kodu gir.';return}joinRoom(c,false)};
$('st').onclick=()=>{if(rm)rm.presence({st:1}).catch(()=>{});startGame()};
$('lvb').onclick=async()=>{await leaveRoom();lx=lz=0;$('mlob').style.display='none';$('mmain').style.display='flex'};
$('solo').onclick=()=>startGame();
// oyun akışı
let tick=0;
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;
 if(run&&!paused)step(dt);
 if(run){draw(dt);if(rm&&(tick++%3==0)){const m=P.hang>=0?3:(!P.g?4:(!P.mv?0:(P.run?2:1)));rm.presence({x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),r:+ry.toFixed(2),h:+headG.rotation.y.toFixed(2),m}).catch(()=>{})}}
 else drawMenu(dt);
 updRem(dt);ren.render(scene,cam);requestAnimationFrame(loop)}
function startGame(){deaths=0;cp=0;yaw=0;pitch=.4;inLobby=false;$('dc').textContent='Ölüm: 0';reset();model.scale.setScalar(.7);cam.fov=userFov;cam.updateProjectionMatrix();cam.position.set(0,4,8);
 run=true;paused=false;K={};$('menu').style.display='none';$('msg').style.display='none';document.body.classList.add('play');cv.requestPointerLock()}
async function toMenu(){run=false;paused=false;document.exitPointerLock();document.body.classList.remove('play');$('pause').style.display='none';$('msg').style.display='none';
 await leaveRoom();lx=lz=0;cam.fov=75;cam.updateProjectionMatrix();$('mlob').style.display='none';$('mmain').style.display='flex';$('menu').style.display='flex';$('lv').textContent='Yükseklik: 0 m'}
function end(){document.exitPointerLock();const m=$('msg');m.style.display='flex';m.innerHTML=`<h1>Göğe ulaştın!</h1><p>${deaths} kere düştün.</p>`;
 const a=document.createElement('button');a.textContent='Tekrar';a.onclick=startGame;const b=document.createElement('button');b.textContent='Ana Menü';b.className='alt';b.onclick=toMenu;m.append(a,b)}
function pauseOn(){if(!run||paused)return;paused=true;K={};$('pause').style.display='flex';$('pmain').style.display='flex';$('pset').style.display='none'}
function pauseOff(){paused=false;$('pause').style.display='none';cv.requestPointerLock()}
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==cv)pauseOn()});
$('resume').onclick=pauseOff;
$('setb').onclick=()=>{$('pmain').style.display='none';$('pset').style.display='flex'};
$('back').onclick=()=>{$('pset').style.display='none';$('pmain').style.display='flex'};
$('sens').oninput=e=>{sens=+e.target.value;$('sv').textContent=sens};
$('fov').oninput=e=>{userFov=+e.target.value;cam.fov=userFov;cam.updateProjectionMatrix();$('fv').textContent=userFov+'°'};
$('quit').onclick=toMenu;
reset();requestAnimationFrame(loop);
</script></body></html>
